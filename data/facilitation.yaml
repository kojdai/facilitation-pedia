inflows:
- from_id: lab_method
  primary: true
  core: true
  note: 【中核の源】1946年コネチカットでのレヴィンのワークショップに始まり、翌1947年ベセル（メイン州）でTグループが確立、NTL設立。話の「内容」ではなく「プロセス（どう話されたか）」に注目する視点が、現代ファシリテーションの基礎となった。
- from_id: humanistic
  primary: true
  core: true
  note: 【中核の源】ロジャーズのベーシック・エンカウンター・グループ。「人と人とが関わるところに生じる問題」に寄り添う“促進する人”としての関わりから、「ファシリテーター」という語と役割そのものが生まれた。
- from_id: org_dev
  primary: true
  note: Tグループから発展した組織開発(OD)。プロセスへの介入・伴走として、組織変革の現場のファシリテーションを担う。
- from_id: dialogue
  primary: true
  note: 対話・ホールシステム（ワールドカフェ・OST、カヘンの社会変革）。大人数の合意形成・社会変革の場づくりへ。
- from_id: drama_edu
  note: 応用インプロ・演劇的手法が、創造的な場づくりの技法として流入。
- from_id: learning_sci
  note: 経験学習・ID・成人学習が、研修・ワークショップ設計の方法を与える（ラーニング・ファシリテーション）。
- from_id: theory_u
  note: U理論・SPTが、変容的な場のプロセスをもたらす。
applications:
- ja: 紛争解決・社会変革
  note: 対立する関係者を集め対話で変容を起こす応用。アダム・カヘン（Reos Partners、南アフリカのモンフルー・シナリオ等）に代表される紛争解決ファシリテーション。
- ja: ワークショップ
  note: 参加型の創造・学習の場づくり（中野民夫らが普及）。ファシリテーションの代表的な応用先のひとつ。
- ja: 地域・まちづくり
  note: 地域の多様なステークホルダーを巻き込む合意形成・まちづくり（社会系の応用）。
- ja: 組織変革
  note: 組織開発(OD)・チームづくりなど組織変革の現場での実践（中村和彦ら）。
- ja: 会議の進行
  note: 意思決定と合意形成を促す会議ファシリテーション（ビジネス系の応用）。
