- id: edu_philosophy
  ja: 教育哲学・批判教育学・教育人間学
  en: Educational Philosophy & Critical Pedagogy
  hex: '#8a1030'
  desc: 教育の目的と人間形成を問う源流。デューイの民主主義、フレイレの批判教育学（意識化）、ブーバーの対話哲学、ビースタの『よい教育』、日本の教育人間学が、対話と解放の認識論的土台を与える。
- id: pragmatism
  ja: プラグマティズム・省察的実践
  en: Pragmatism & Reflective Practice
  hex: '#b1001e'
  desc: 経験と省察を学びの中心に据える。デューイの『為すことによって学ぶ』、ショーンの『行為の中の省察』、コルブの経験学習サイクル、コルトハーヘンのリアリスティック・アプローチが、経験学習とリフレクションの母体となる。
- id: humanistic
  ja: 人間性心理学・パーソンセンタード
  en: Humanistic & Person-Centered Psychology
  hex: '#e6002d'
  desc: 自己実現と無条件の肯定的関心を核とする第三勢力心理学。マズロー、ロジャーズのパーソンセンタード、ジェンドリンのフォーカシングが、エンカウンター・傾聴・アサーション・NVC・コンパッションへと展開する。
- id: learning_sci
  ja: 学習科学・教育工学・ID
  en: Learning Sciences & Instructional Design
  hex: '#ef4055'
  desc: 人はどう学び、学習環境をどう設計するか。ヴィゴツキー／ピアジェの構成主義、ガニェ・ライゲルースのインストラクショナルデザイン、レイヴ＆ウェンガーの状況的学習、学習科学とハッティの教育効果研究、研修転移・HPIを含む。
- id: lab_method
  ja: 集団力学・ラボラトリー方式
  en: Group Dynamics & Laboratory Method
  hex: '#ff7090'
  desc: クルト・レヴィンの場の理論とアクションリサーチを源流に、NTLのTグループ（ラボラトリー方式の体験学習）が誕生。『いま・ここ』の集団過程からの体験学習が、ファシリテーションの直接の母体となった（日本では南山大学が継承）。
- id: drama_edu
  ja: 演劇・ドラマ教育（応用インプロ）
  en: Drama Education & Applied Improvisation
  hex: '#ffb066'
  desc: 身体性・即興・創発を場づくりに応用する。スポーリンとジョンストンの即興演劇、ボアールの被抑圧者の演劇、教育現場の演劇的手法（高尾隆ほか）、プレイバックシアターやSPTが、創造性と協働を引き出す。
- id: dialogue
  ja: 対話・ホールシステム・社会構成主義
  en: Dialogue, Whole-System & Social Construction
  hex: '#d62388'
  desc: 言葉が現実を構成するという社会構成主義（ガーゲン）を土台に、ボームのダイアログ、アイザックスのダイアローグ、ワールド・カフェ・OST・サークル・Art of Hosting、オープンダイアローグなど、大人数の集合的対話を扱う。
- id: org_dev
  ja: 組織開発（OD）
  en: Organization Development
  hex: '#f57e00'
  desc: 応用行動科学を基盤に、組織のプロセスへ介入して健全性とパフォーマンスを高める。シャインのプロセス・コンサルテーション、アージリスの組織学習、クーパーライダーのAI、ブッシュ＆マーシャクの対話型ODが合流する、現代実践の中心。
- id: knowledge
  ja: 知識創造
  en: Knowledge Creation
  hex: '#c98a00'
  desc: 野中郁次郎・竹内弘高の組織的知識創造論。暗黙知と形式知が変換され続けるSECIモデルと『場（ba）』、実践知（フロネシス）に基づくワイズリーダーシップが、日本発の経営知として源流に加わる。
- id: systems
  ja: システム思考・複雑系
  en: Systems Thinking & Complexity
  hex: '#0a86a3'
  desc: 事象を相互作用する全体として捉える。ベイトソン、フォレスターのシステムダイナミクス、メドウズ、センゲの学習する組織、スノーデンのCynefinなど、サイバネティクスから複雑系までのシステム論の系譜。
- id: adult_dev
  ja: 成人発達・変容
  en: Adult Development & Transformation
  hex: '#6a3a8a'
  desc: 成人以降の意味づけの構造が段階的に発達・変容する。ピアジェ／コールバーグの構成的発達、キーガンの成人発達、メジローの変容的学習、トルバートのアクション・インクワイアリが、垂直的成長と発達指向型組織の地図を描く。
- id: theory_u
  ja: U理論・プレゼンシング
  en: Theory U & Presencing
  hex: '#8a5acf'
  desc: オットー・シャーマーらが提唱する、出現する未来からリードする変容の理論。開いて手放し迎え入れるU字のプロセスと、身体性を伴うソーシャル・プレゼンシング・シアター（SPT）が、システム変容の方法論を与える。
- id: integral
  ja: インテグラル・スパイラル
  en: Integral Theory & Spiral Dynamics
  hex: '#b07ad8'
  desc: ケン・ウィルバーのインテグラル理論（AQAL＝全象限・全レベル）と、グレイブス／ベックのスパイラル・ダイナミクスが、多様な発達段階と世界観を統合的に地図化するメタ理論を提供する。
