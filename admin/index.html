<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ファシリテーション学習地図 — 編集</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      /* CMS の読み込み中に真っ白な画面を見せない。
         初めて来た人にとって、白い画面は「壊れた」と同義になる。 */
      #boot { padding: 2.5rem 1.5rem; max-width: 34rem; margin: 0 auto; color: #1b1b1b; line-height: 2; }
      #boot h1 { font-size: 1.2rem; color: #026a6b; }
      #boot a { color: #026a6b; }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>編集画面を読み込んでいます…</h1>
      <p>
        数秒たっても切り替わらない場合は、ページを再読み込みしてください。
        それでも表示されないときは
        <a href="https://github.com/kojdai/facilitation-pedia/issues">Issue</a> で教えてください。
      </p>
      <p>
        編集した内容は<strong>提案として送られます</strong>。
        確認を経てから地図に反映されるので、壊す心配はありません。
      </p>
    </div>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
